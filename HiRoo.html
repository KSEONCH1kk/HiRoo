<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HiRoo — community chat & voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --accent: #7c5cff;
      --accent-2: #b388ff;
      --accent-soft: rgba(124, 92, 255, 0.14);

      --bg-0: #0b0c11;
      --bg-1: #11131a;
      --bg-2: #171924;
      --bg-3: #1f2130;
      --bg-hover: rgba(255,255,255,0.04);
      --bg-active: rgba(124,92,255,0.14);

      --line: rgba(255,255,255,0.06);
      --line-strong: rgba(255,255,255,0.10);

      --text-0: #f2f2f6;
      --text-1: #cfd0d8;
      --text-2: #8a8c99;
      --text-3: #5d5f6d;

      --ok: #3ecf8e;
      --warn: #f5a524;
      --danger: #ff5a6a;
      --away: #f5a524;
      --idle: #8a8c99;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
    }
    html[data-theme="light"] {
      --bg-0: #f6f4ef;
      --bg-1: #ffffff;
      --bg-2: #ffffff;
      --bg-3: #eeece7;
      --bg-hover: rgba(0,0,0,0.04);
      --bg-active: rgba(124,92,255,0.12);
      --line: rgba(0,0,0,0.07);
      --line-strong: rgba(0,0,0,0.12);
      --text-0: #14141a;
      --text-1: #2b2c36;
      --text-2: #696b79;
      --text-3: #9a9ca8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-0);
      color: var(--text-0);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-feature-settings: 'cv11','ss01','ss03';
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body { overflow-x: hidden; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }
    html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ringPulse {
      0% { box-shadow: 0 0 0 0 rgba(124,92,255,0.5); }
      70% { box-shadow: 0 0 0 24px rgba(124,92,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(124,92,255,0); }
    }
    @keyframes speaking {
      0%,100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="application/json" id="tweaks-config">
  /*EDITMODE-BEGIN*/{
    "accent": "#ff5a6a",
    "theme": "dark"
  }/*EDITMODE-END*/
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/primitives.jsx"></script>
  <script type="text/babel" src="src/chrome.jsx"></script>
  <script type="text/babel" src="src/server-view.jsx"></script>
  <script type="text/babel" src="src/dm-view.jsx"></script>
  <script type="text/babel" src="src/voice-view.jsx"></script>
  <script type="text/babel" src="src/screenshare-view.jsx"></script>
  <script type="text/babel" src="src/overlays.jsx"></script>
  <script type="text/babel" src="src/settings-view.jsx"></script>
  <script type="text/babel" src="src/friends-view.jsx"></script>
  <script type="text/babel" src="src/inbox-view.jsx"></script>
  <script type="text/babel" src="src/mobile.jsx"></script>
  <script type="text/babel" src="src/tweaks.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
