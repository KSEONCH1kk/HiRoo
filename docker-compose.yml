version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiroo
      POSTGRES_PASSWORD: hiroo_dev
      POSTGRES_DB: hiroo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiroo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://hiroo:hiroo_dev@db:5432/hiroo
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      REFRESH_SECRET_KEY: dev-refresh-key-change-in-production-32chars
      CORS_ORIGINS: '["http://localhost:3000","http://77.90.33.108","https://hiroo.intave.tech"]'
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      LIVEKIT_URL: wss://hiroo.intave.tech/livekit/
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-change-me-to-a-random-32-char-string
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./yt-cookies.txt:/app/secrets/yt-cookies.txt:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://hiroo.intave.tech
        NEXT_PUBLIC_WS_URL: wss://hiroo.intave.tech
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://hiroo.intave.tech
      NEXT_PUBLIC_WS_URL: wss://hiroo.intave.tech
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001:3000"
    depends_on:
      - backend

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n --no-cli --no-tls --no-dtls
      --listening-port=3478
      --external-ip=$$(curl -s ifconfig.me)
      --realm=hiroo.intave.tech
      --user=hiroo:hiroo-turn-secret-change-me
      --lt-cred-mech

volumes:
  postgres_data:
  uploads_data:
