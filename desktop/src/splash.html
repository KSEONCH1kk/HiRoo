<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>HiRoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    color: #fff;
    -webkit-app-region: drag;
  }
  .card {
    width: 100%; height: 100%;
    border-radius: 18px;
    background:
      radial-gradient(circle at 20% 0%, rgba(124,92,255,0.55), transparent 55%),
      radial-gradient(circle at 100% 120%, rgba(94,182,255,0.45), transparent 60%),
      #0e0e13;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 28px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: -40%;
    background: conic-gradient(from 0deg, transparent, rgba(124,92,255,0.18), transparent 40%);
    animation: spin 6s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo {
    width: 64px; height: 64px; border-radius: 20px;
    background: linear-gradient(180deg, #8f73ff, #7c5cff);
    box-shadow: 0 10px 30px rgba(124,92,255,0.45);
    display: flex; align-items: center; justify-content: center;
    font-family: "Instrument Serif", "Playfair Display", Georgia, serif;
    font-weight: 600; font-size: 32px; letter-spacing: -1.5px;
    animation: pulse 2.2s ease-in-out infinite;
    position: relative; z-index: 1;
    color: #fff;
  }
  .logo .r {
    margin-left: -3px;
    font-style: italic;
    opacity: 0.85;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1);   box-shadow: 0 10px 30px rgba(124,92,255,0.45); }
    50%     { transform: scale(1.06); box-shadow: 0 14px 36px rgba(124,92,255,0.65); }
  }

  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    position: relative; z-index: 1;
  }
  p { font-size: 12.5px; color: rgba(255,255,255,0.55); position: relative; z-index: 1; }

  .bar {
    width: 240px; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.08); overflow: hidden;
    position: relative; z-index: 1;
  }
  .bar::after {
    content: ""; position: absolute; inset: 0;
    width: 40%; background: linear-gradient(90deg, transparent, #7c5cff, transparent);
    animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">H<span class="r">r</span></div>
    <h1>HiRoo</h1>
    <p>Соединяемся…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
