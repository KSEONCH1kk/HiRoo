<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Solid accent square, 14/44 corner radius from the web UI scaled up. -->
  <rect width="256" height="256" rx="82" fill="#7c5cff"/>
  <!-- "Hr" — same Instrument Serif lockup used in /login, the tray button,
       etc. Letter-spacing / italic-r offset / opacity 0.85 come straight
